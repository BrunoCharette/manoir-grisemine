<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Grisemine">
<title>Le manoir de Grisemine</title>
<style>
/* Page autonome pour iPad iOS 9 (Safari 9) : ni variables CSS, ni grid, ni gap, ni env(). */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#07040a;color:#ece2d0;font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
input{-webkit-user-select:text;user-select:text}
[data-a],[data-k],button{cursor:pointer}
#fond{position:fixed;top:0;left:0;right:0;bottom:0;background:#0b0610;background:radial-gradient(ellipse at 50% 18%,#2b1739 0%,#140a1d 50%,#050307 100%);overflow:hidden}
.brume{position:absolute;left:-50%;width:200%;height:50%;bottom:-12%;background:radial-gradient(ellipse at center,rgba(170,160,200,.17) 0%,rgba(170,160,200,0) 62%);animation:brume 26s ease-in-out infinite alternate}
.brume.b2{bottom:auto;top:-20%;opacity:.55;animation-duration:38s;animation-direction:alternate-reverse}
@keyframes brume{from{transform:translate3d(-12%,0,0)}to{transform:translate3d(12%,0,0)}}
#vignette{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;box-shadow:inset 0 0 110px 0 rgba(0,0,0,.95);z-index:5}
#eclair{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;background:#dfe6ff;opacity:0;z-index:6}
#eclair.flash{animation:eclair 1.6s ease-out}
@keyframes eclair{0%{opacity:0}8%{opacity:.16}16%{opacity:.03}26%{opacity:.2}100%{opacity:0}}
#app{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2}
.defile{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{max-width:920px;margin:0 auto;padding:88px 18px 70px}
.centre{text-align:center}
.ico{display:inline-block;vertical-align:middle}
h1,h2,.titre{font-family:Copperplate,"Copperplate Gothic Light",Georgia,serif;font-weight:normal;letter-spacing:.08em;text-transform:uppercase}
h2{font-size:27px;margin:4px 0 10px;color:#f3e3c0;text-shadow:0 0 18px rgba(255,170,60,.35)}
.consigne{font-size:19px;line-height:1.45;margin:0 0 16px;opacity:.94}
.btn{display:inline-block;border:2px solid #b47cff;background:rgba(40,18,52,.88);color:#f6ead2;font-size:20px;padding:12px 26px;border-radius:40px;min-height:52px;font-family:inherit;margin:6px;text-align:center;line-height:1.3}
.btn:active,.opt:active,.case:active{transform:scale(.97)}
.btn-sec{border-color:rgba(255,255,255,.3);font-size:17px}
.carte{background:#e6d7b8;background:linear-gradient(160deg,#efe2c4,#d4bf98);color:#2a1a10;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.6),inset 0 0 40px rgba(120,80,30,.25);padding:16px}
.apparait{animation:apparait .7s ease-out}
@keyframes apparait{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.secoue{animation:secoue .5s}
@keyframes secoue{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lueur{animation:lueur 6s infinite}
@keyframes lueur{0%,100%{text-shadow:0 0 22px rgba(255,140,40,.55)}46%{text-shadow:0 0 22px rgba(255,140,40,.55)}48%{text-shadow:0 0 2px rgba(255,140,40,.1)}50%{text-shadow:0 0 26px rgba(255,140,40,.7)}52%{text-shadow:0 0 4px rgba(255,140,40,.15)}}
.fl{animation:flamme 1.3s ease-in-out infinite alternate}
@keyframes flamme{from{opacity:1}to{opacity:.7}}

/* Accueil */
.accueil{text-align:center;padding-top:40px}
.accueil h1{font-size:46px;line-height:1.15;margin:10px 0 6px;color:#f6e2b8}
.sous{font-size:19px;opacity:.75;margin:0 0 28px;font-style:italic}
.lune-acc{width:150px;height:150px;border-radius:50%;margin:0 auto;background:#efdfba;box-shadow:0 0 60px 20px rgba(246,231,200,.25);position:relative}
.lune-acc svg{position:absolute;width:110px;left:-30px;top:40px}
.choix-eq{margin:0 -6px}
.eq-btn{display:inline-block;vertical-align:top;width:calc(50% - 14px);margin:7px;padding:18px 10px;border-radius:18px;border:2px solid;background:rgba(18,9,24,.85);text-align:center}
.eq-btn svg{width:80px;height:80px}
.eq-btn b{display:block;font-family:Copperplate,Georgia,serif;letter-spacing:.08em;text-transform:uppercase;font-size:22px;margin-top:6px}
.eq-btn small{display:block;font-size:15px;opacity:.7;margin-top:4px}
.liens{margin-top:26px}

/* Entête d'équipe */
#entete{position:fixed;top:0;left:0;right:0;height:70px;z-index:4;background:linear-gradient(rgba(5,3,8,.97),rgba(5,3,8,.7));border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 10px}
.blason{width:54px;height:54px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;background:#140b1c;flex:none}
.blason svg{width:40px;height:40px}
.ent-titre{flex:1;margin-left:10px;min-width:0}
.ent-titre b{display:block;font-family:Copperplate,Georgia,serif;letter-spacing:.06em;text-transform:uppercase;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-titre small{font-size:13px;opacity:.7}
.progres{white-space:nowrap;margin:0 4px}
.progres svg{width:22px;height:26px;opacity:.22}
.progres svg.on{opacity:1}
.btn-mini{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#ece2d0;border-radius:24px;padding:0 12px;height:46px;font-size:16px;margin-left:6px;display:flex;align-items:center;flex:none}
.btn-mini svg{width:24px;height:24px;margin-right:4px}

/* Murmures et voiles */
#murmure{position:fixed;left:5%;right:5%;top:84px;z-index:8;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#murmure span{display:inline-block;background:rgba(10,4,14,.94);border:1px solid rgba(180,124,255,.5);color:#e8d8ff;padding:12px 22px;border-radius:30px;font-style:italic;font-size:19px}
#murmure.vu{opacity:1}
.voile{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:rgba(3,1,5,.9);display:flex;align-items:center;justify-content:center;padding:20px;animation:fondu .5s;overflow-y:auto}
.voile .boite{max-width:640px;width:100%;text-align:center}
.voile p{font-size:20px;line-height:1.5}
.titre-voile{font-family:Copperplate,Georgia,serif;text-transform:uppercase;letter-spacing:.1em;font-size:30px;color:#ffd36a;margin-bottom:12px;text-shadow:0 0 20px rgba(255,190,60,.5)}
@keyframes fondu{from{opacity:0}to{opacity:1}}
.indice{background:rgba(255,255,255,.07);border-left:4px solid #b47cff;text-align:left;padding:12px 16px;margin:10px 0;font-size:19px;line-height:1.4;border-radius:6px}

/* Petites apparitions */
.yeux{position:fixed;z-index:3;width:70px;height:16px;pointer-events:none;animation:yeux 4.2s ease-in-out forwards}
.yeux i{position:absolute;top:0;left:0;width:24px;height:13px;border-radius:50%;background:#ffd54a;box-shadow:0 0 14px 4px rgba(255,190,40,.55);animation:cligne 4.2s}
.yeux i+i{left:40px}
@keyframes yeux{0%{opacity:0}18%{opacity:.95}82%{opacity:.95}100%{opacity:0}}
@keyframes cligne{0%,38%,44%,68%,74%,100%{transform:scaleY(1)}41%,71%{transform:scaleY(.1)}}
.descente{position:fixed;top:0;z-index:3;width:60px;height:240px;margin-left:-30px;pointer-events:none;animation:descente 10s ease-in-out forwards}
.descente i{position:absolute;left:29px;top:0;width:1px;height:200px;background:rgba(220,220,230,.5)}
.descente svg{position:absolute;bottom:0;left:0;width:60px;height:60px}
@keyframes descente{0%{transform:translate3d(0,-250px,0)}40%,62%{transform:translate3d(0,0,0)}100%{transform:translate3d(0,-250px,0)}}
.vol{position:fixed;left:0;z-index:3;width:110px;pointer-events:none;animation:vol 7s linear forwards}
.vol svg{width:110px;animation:ailes .18s ease-in-out infinite alternate}
@keyframes vol{0%{transform:translate3d(-160px,0,0)}25%{transform:translate3d(25vw,-50px,0)}50%{transform:translate3d(50vw,25px,0)}75%{transform:translate3d(75vw,-35px,0)}100%{transform:translate3d(110vw,0,0)}}
@keyframes ailes{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
.chuchot{position:fixed;z-index:3;pointer-events:none;font-family:Georgia,serif;font-style:italic;color:rgba(230,210,255,.75);font-size:24px;text-shadow:0 0 12px rgba(160,100,255,.6);animation:chuchot 6s ease-in-out forwards;max-width:60%}
@keyframes chuchot{0%{opacity:0;transform:translate3d(0,8px,0)}25%,70%{opacity:1}100%{opacity:0;transform:translate3d(0,-10px,0)}}

/* Récit */
.recit{max-width:680px;margin:0 auto}
.recit-ico{text-align:center}
.recit-ico svg{width:120px;height:120px}
.recit h2{text-align:center;font-size:32px}
.recit p{font-size:21px;line-height:1.55}

/* Choix */
.notes{margin:0 0 14px}
.note{background:#f3e9c9;color:#2a1a10;padding:10px 14px 10px 46px;margin:8px 0;border-radius:4px;font-size:18px;line-height:1.35;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.5);transform:rotate(-.6deg)}
.note:nth-child(2n){transform:rotate(.7deg)}
.note svg{position:absolute;left:8px;top:8px;width:30px;height:30px}
.opts{margin:0 -6px}
.opt{display:inline-block;vertical-align:top;width:calc(50% - 12px);margin:6px;text-align:center;min-height:200px;border:3px solid transparent;transition:border-color .3s}
.opt svg{width:70px;height:70px}
.opt b{display:block;font-family:Copperplate,Georgia,serif;letter-spacing:.04em;text-transform:uppercase;font-size:19px;margin:6px 0}
.opt p{font-size:17px;line-height:1.4;margin:0}
.opt.choisi{border-color:#5fd35a;box-shadow:0 0 30px rgba(95,211,90,.6)}

/* Série de questions */
.bougies{text-align:center;margin:4px 0 6px}
.bougies svg{width:36px;height:46px;opacity:.2;margin:0 2px}
.bougies svg.on{opacity:1}
.question{font-size:32px;font-family:Georgia,serif;text-align:center;margin:20px 0 22px;line-height:1.35}
.trou{display:inline-block;min-width:110px;border-bottom:3px dashed #ffd36a;color:#ffd36a}
.reps{text-align:center}
.rep{min-width:170px;font-size:22px;font-family:Georgia,serif}
.rep.juste{border-color:#5fd35a;background:#1f3d1c}
.lettres{text-align:center;margin:6px 0}
.lettres span{display:inline-block;width:52px;height:62px;line-height:62px;margin:4px;border-bottom:3px solid #ffd36a;font-size:38px;font-family:Georgia,serif;color:#ffd36a;vertical-align:bottom}

/* Cadenas à chiffres */
.cad{text-align:center;margin:20px auto 0;max-width:430px;padding:16px;border-radius:16px;background:rgba(20,10,26,.88);border:1px solid rgba(255,255,255,.14)}
.cad-ico{width:54px;height:54px}
.cad-t{font-family:Copperplate,Georgia,serif;text-transform:uppercase;letter-spacing:.08em;font-size:18px;margin:4px 0;color:#d9c49a}
.cases{margin:10px 0 14px;white-space:nowrap}
.case{display:inline-block;width:52px;height:64px;line-height:62px;margin:0 3px;border-radius:8px;background:#0c0710;border:2px solid #5a4a6a;font-size:36px;font-family:Georgia,serif;color:#ffd36a;vertical-align:middle}
.cases.ouvert .case{border-color:#5fd35a;color:#8ff07a;box-shadow:0 0 16px rgba(95,211,90,.5)}
.pave{font-size:0}
.pave button{width:30%;height:58px;margin:1.5%;font-size:26px;border-radius:12px;border:1px solid #4a3a5a;background:#231531;color:#f0e4cc;font-family:Georgia,serif;-webkit-appearance:none}
.pave button.petit{font-size:16px;font-family:inherit}
.pave button.vide{visibility:hidden}

/* Recette et étagère (grenier) */
.recette{text-align:center;margin-bottom:16px}
.recette .titre{font-size:20px;margin-bottom:6px}
.recette svg{width:64px;height:64px;margin:4px}
.etagere{margin:0 -5px;text-align:center}
.pot{display:inline-block;vertical-align:top;width:calc(33.33% - 10px);margin:5px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 4px;border-bottom:6px solid #3a2516}
.pot svg{width:58px;height:58px}
.pot div{font-size:19px;font-family:Georgia,serif;color:#f6e7c8;margin-top:4px}

/* Tri des balais */
.plateau{min-height:64px;text-align:center;padding:8px;border-radius:14px;background:rgba(0,0,0,.3);margin-bottom:10px}
.puce{display:inline-block;margin:5px;padding:10px 16px;border-radius:26px;background:#efe2c4;color:#2a1a10;font-size:19px;border:3px solid transparent;font-family:Georgia,serif}
.puce.sel{border-color:#ffd36a;box-shadow:0 0 16px rgba(255,211,106,.9)}
.bacs{margin:0 -6px}
.bac{display:inline-block;vertical-align:top;width:calc(50% - 12px);margin:6px;min-height:130px;border:2px dashed rgba(255,255,255,.3);border-radius:14px;padding:10px;background:rgba(0,0,0,.4);text-align:center}
.bac-t{font-family:Copperplate,Georgia,serif;letter-spacing:.04em;font-size:18px;color:#ffd36a;margin-bottom:6px}
.vide-txt{opacity:.5;font-style:italic;font-size:15px}

/* Collection de balais (couleurs) */
.balais{text-align:center;font-size:0}
.balai{display:inline-block;vertical-align:top;width:15.6%;margin:0 .5%;background:rgba(0,0,0,.45);border-radius:10px;padding:8px 3px 10px;font-size:15px;line-height:1.3}
.balai .n{display:block;color:#ffd36a;font-family:Georgia,serif;font-size:18px}
.balai svg{width:32px;height:96px}
.plaque{background:#000;color:#fff;border:1px solid #777;font-family:Copperplate,Georgia,serif;font-size:13px;letter-spacing:.02em;padding:6px 2px;margin:6px 0;border-radius:4px}
.gn{font-weight:bold;margin:6px 0;font-family:Georgia,serif}
.pastilles{margin:6px 0 10px}
.pastille{display:inline-block;width:54px;height:54px;border-radius:50%;margin:5px;border:3px solid rgba(255,255,255,.35);vertical-align:middle;line-height:48px;font-size:24px;color:#fff;background:#120a18}

/* Jardin (placer) */
.lettre{font-family:Noteworthy,"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:19px;line-height:1.5}
.lettre p{margin:0 0 8px}
.lettre ul{margin:0 0 8px;padding-left:20px}
.lettre li{margin-bottom:6px}
.scene{position:relative;width:100%;padding-bottom:70%;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.scene svg.decor{position:absolute;top:0;left:0;width:100%;height:100%}
.spot{position:absolute;width:14%;margin-left:-7%;margin-top:-7%;border-radius:50%;border:3px dashed rgba(255,240,200,.7);background:rgba(255,240,200,.14)}
.spot:before{content:'';display:block;padding-bottom:100%}
.spot .num{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:#ffd36a;color:#2a1a10;font-weight:bold;text-align:center;line-height:28px;font-size:17px;z-index:2}
.spot svg{position:absolute;top:2%;left:2%;width:96%;height:96%}
.spot.plein{border-style:solid;border-color:#ffd36a}
.spot .chf,.cit .chf{position:absolute;bottom:-6px;left:50%;margin-left:-15px;width:30px;height:30px;border-radius:50%;background:#fff8e6;color:#2a1a10;font-weight:bold;line-height:27px;text-align:center;font-family:Georgia,serif;font-size:19px;border:2px solid #2a1a10;z-index:2}
.plateau-cit{text-align:center;margin:12px 0 0;padding:6px;border-radius:14px;background:rgba(0,0,0,.35);min-height:110px}
.cit{display:inline-block;width:17%;margin:1%;position:relative;padding:4px 4px 12px;border-radius:12px;border:3px solid transparent;vertical-align:top}
.cit svg{width:100%;height:auto}
.cit.sel{border-color:#ffd36a;box-shadow:0 0 16px rgba(255,211,106,.9)}
.deux>div{margin-bottom:14px}
@media (orientation:landscape){.deux{display:flex;align-items:flex-start}.deux>div{flex:1;min-width:0}.deux>div+div{margin-left:14px}}

/* Bocaux (ordre) */
.bocaux{text-align:center;font-size:0}
.bocal{display:inline-block;width:18%;margin:1%;position:relative;vertical-align:top;font-size:15px}
.bocal svg{width:100%;height:auto}
.bocal .etq{position:absolute;top:36%;left:14%;right:14%;line-height:1.25;color:#2a1a10;background:#efe2c4;border-radius:6px;padding:6px 3px;font-family:Georgia,serif;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.bocal.pris{opacity:.3}
.bocal .rang{position:absolute;top:-6px;right:-4px;width:30px;height:30px;border-radius:50%;background:#ffd36a;color:#2a1a10;line-height:30px;font-weight:bold;font-size:17px}

/* Liste de courses (erreurs) */
.liste{font-family:Noteworthy,"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:24px;line-height:1.9}
.liste .titre{font-size:20px;margin-bottom:8px}
.mot{padding:2px 3px;border-radius:6px}
.mot.trouve{background:rgba(70,150,60,.25)}
.mot.trouve s{color:#a33}
.mot.trouve b{color:#1d6a1a}
.mot.bien{background:rgba(120,90,160,.3)}
.compteur{text-align:center;font-size:20px;margin:12px 0;color:#ffd36a}

/* Construire */
.cible{text-align:center;font-size:20px;margin:8px 0}
.cible b{font-family:Copperplate,Georgia,serif;color:#ffd36a;letter-spacing:.05em}
.phrase{min-height:66px;border-bottom:2px solid #ffd36a;font-size:30px;font-family:Georgia,serif;padding:12px;margin:10px auto 16px;text-align:center;max-width:620px}
.tuiles{text-align:center}
.tuile{display:inline-block;padding:12px 20px;margin:6px;border-radius:10px;background:#efe2c4;color:#2a1a10;font-size:24px;font-family:Georgia,serif;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.tuile.usee{visibility:hidden}

/* Message et sceau */
.message,.sceau-ecran,.fin{text-align:center;max-width:680px;margin:0 auto}
.msg-ico{width:120px;height:120px;animation:flotte 3s ease-in-out infinite alternate}
@keyframes flotte{from{transform:translate3d(0,-6px,0)}to{transform:translate3d(0,6px,0)}}
.mot-secret{font-family:Georgia,serif;font-size:52px;letter-spacing:.14em;color:#e8d8ff;text-shadow:0 0 24px rgba(180,124,255,.9);margin:14px 0 18px}
.sceau{position:relative;width:170px;height:170px;margin:0 auto}
.sceau>svg{width:170px;height:170px}
.sceau-ico{position:absolute;top:50%;left:50%;width:80px;height:80px;margin:-40px 0 0 -40px;opacity:.55}
.sceau-ico svg{width:80px;height:80px}
.sceau.brise{animation:brise 1s forwards}
@keyframes brise{30%{transform:scale(1.1) rotate(4deg)}100%{transform:scale(.6) rotate(-20deg);opacity:0}}
.mdp{font-size:28px;padding:12px;border-radius:12px;border:2px solid #b47cff;background:#0c0710;color:#ffd36a;text-align:center;width:100%;max-width:420px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 4px;font-family:Georgia,serif;-webkit-appearance:none}
.ingr svg{width:130px;height:130px}
.ingr b{display:block;font-family:Copperplate,Georgia,serif;text-transform:uppercase;letter-spacing:.06em;font-size:24px;color:#ffd36a;margin:6px 0 16px}
.fin-carte{margin:0 auto 18px;max-width:520px}
.fin-carte small{text-transform:uppercase;letter-spacing:.1em;font-size:13px;opacity:.7}
.gros-chiffre{font-family:Georgia,serif;font-size:76px;line-height:1.1;color:#5a1d6e}
.vers{font-family:Noteworthy,"Segoe Print",Georgia,serif;font-size:26px;margin:4px 0 4px}
.fin-l+.fin-l{border-top:1px dashed rgba(42,26,16,.4);margin-top:10px;padding-top:10px}

/* Tableau (TNI) */
.tni{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.tni-intro{max-width:1100px;margin:0 auto;padding:5vh 4vw;text-align:center}
.tni-intro h1{font-size:5.4vw;color:#f6e2b8;margin:0 0 3vh}
.tni-intro p{font-size:2.5vw;line-height:1.45;margin:0 0 2.4vh;font-family:Georgia,serif}
.tni-intro .btn{font-size:2vw;padding:1.4vh 3vw}
.duree{font-size:2.4vw;margin:2vh 0}
.duree b{display:inline-block;min-width:8vw;color:#ffd36a;font-size:3.4vw;font-family:Georgia,serif}
.tni-veille{display:flex;height:100%;align-items:center;padding:2vh 2vw}
.tni-scene{flex:0 0 60%;position:relative}
.tni-scene .scene{box-shadow:0 0 60px rgba(0,0,0,.9)}
.tni-cote{flex:1;text-align:center;padding-left:2vw}
.chrono{font-size:9vw;font-family:Georgia,serif;color:#ffd36a;text-shadow:0 0 30px rgba(255,170,40,.5);line-height:1}
.chrono-l{font-family:Copperplate,Georgia,serif;text-transform:uppercase;letter-spacing:.12em;font-size:1.5vw;opacity:.75;margin:1vh 0}
.bougie-tni{position:relative;height:28vh;width:4.5vw;margin:5vh auto 2vh}
.bougie-tni .corps{position:absolute;bottom:0;left:0;width:100%;background:linear-gradient(90deg,#cdbf9f,#fff6e0,#cbbd9c);border-radius:6px 6px 2px 2px;transition:height 1s linear}
.bougie-tni .flamme{position:absolute;left:50%;top:-6vh;width:3vw;height:6vh;margin-left:-1.5vw;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff4b0 0%,#ffb23a 45%,rgba(255,90,20,0) 72%);animation:flamme 1s ease-in-out infinite alternate}
.blasons-tni{margin:2vh 0}
.blasons-tni span{display:inline-block;width:5.6vw;height:5.6vw;border-radius:50%;border:3px solid;margin:0 .5vw;background:#140b1c;opacity:.35;transition:all .6s;vertical-align:middle}
.blasons-tni span svg{width:70%;height:70%;margin-top:15%}
.blasons-tni span.libre{opacity:1;box-shadow:0 0 30px currentColor}
.tni-btns .btn{font-size:1.5vw;padding:1vh 1.6vw;min-height:0}
.urgence #fond{background:radial-gradient(ellipse at 50% 18%,#3a1420 0%,#1d0a12 50%,#070204 100%)}
.urgence .chrono{color:#ff6a5a;animation:pouls 1.2s infinite}
@keyframes pouls{0%,100%{transform:scale(1)}15%{transform:scale(1.05)}30%{transform:scale(1)}45%{transform:scale(1.03)}}
.chaudron-ecran{display:flex;height:100%;align-items:center;padding:3vh 3vw}
.ch-gauche{flex:0 0 40%;padding-right:2vw}
.ch-gauche h2{font-size:3vw}
.ch-gauche p{font-size:2.1vw;line-height:1.4;font-family:Georgia,serif;margin:0 0 1.6vh}
.ch-centre{flex:1;text-align:center}
.gros-chaudron{width:24vw;height:24vw}
.ingredients-tni span{display:inline-block;width:11vw;margin:.6vw;padding:1vw .4vw;border-radius:16px;border:2px solid rgba(255,255,255,.3);background:rgba(20,10,26,.88);font-size:1.4vw;vertical-align:top}
.ingredients-tni span svg{width:6vw;height:6vw;display:block;margin:0 auto .6vh}
.fentes{margin:1vh 0 2vh}
.fentes span{display:inline-block;width:6vw;height:6vw;border-radius:50%;border:3px dashed rgba(255,211,106,.6);margin:0 .5vw;vertical-align:middle}
.fentes span svg{width:80%;height:80%;margin-top:10%}
.tni .cad{max-width:42vw}
.tni .case{width:7vw;height:9vw;line-height:9vw;font-size:6vw}
.tni .pave button{height:7vh;font-size:3vw}
.tni .pave button.petit{font-size:1.6vw}
.formule{max-width:1200px;margin:0 auto;padding:6vh 4vw;text-align:center}
.formule h2{font-size:3.4vw}
.formule .ligne{font-family:Georgia,serif;font-style:italic;font-size:4vw;margin:2.4vh 0;color:#f3e3c0}
.formule .ligne svg{width:4vw;height:4vw;margin-right:1vw}
.formule .tous{font-size:3vw;color:#ffd36a;margin-top:3vh}
.formule .btn{font-size:2vw}
.finale{position:absolute;top:0;left:0;right:0;bottom:0;padding:0 8vw;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.finale p{font-family:Georgia,serif;font-size:3.6vw;margin:1.6vh 0;opacity:0;transition:opacity 1.6s}
.finale p.vu{opacity:1}
.finale p.petit{font-size:2vw;font-style:italic;color:#c9b8e8}
.finale .gros{font-family:Copperplate,Georgia,serif;text-transform:uppercase;letter-spacing:.1em;font-size:6vw;color:#ffd36a;text-shadow:0 0 40px rgba(255,190,60,.7)}
.bat-f{position:fixed;left:50%;top:50%;width:90px;margin:-25px 0 0 -45px;z-index:7;transition:transform 3s ease-out,opacity 3s ease-in;pointer-events:none}
.bat-f svg{width:90px;animation:ailes .16s ease-in-out infinite alternate}
.coin-prof{position:fixed;top:10px;left:10px;z-index:8;opacity:.35;font-size:14px;padding:6px 10px;border:1px solid rgba(255,255,255,.3);border-radius:16px;background:rgba(0,0,0,.4);color:#ece2d0}

/* Guide */
.guide{background:#f6f0e4;color:#1e1410;position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.guide .page{padding-top:30px;max-width:900px}
.guide h1{font-size:30px;color:#4a1d5e;margin:0 0 6px}
.guide h2{color:#4a1d5e;text-shadow:none;font-size:20px;margin-top:28px;border-bottom:2px solid #4a1d5e;padding-bottom:4px}
.guide p,.guide li{font-size:16px;line-height:1.5}
.guide table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.guide th,.guide td{border:1px solid #bba98c;padding:6px 8px;text-align:left;vertical-align:top}
.guide th{background:#e6dac4}
.guide .code{font-family:Menlo,Consolas,monospace;font-weight:bold;color:#8c1d2c}
.guide .btn{color:#f6ead2}
.mode-guide #vignette,.mode-guide #fond{display:none}
@media print{body,html{overflow:visible;height:auto;background:#fff}#fond,#vignette,.no-print{display:none}#app,.guide{position:static;overflow:visible}}
</style>

var ORDRE_EQ = ['chauve', 'araignee', 'citrouille', 'hibou'];

var MOQUERIES = ['Hé hé hé… pas tout à fait.', 'Le manoir grince de plaisir…', 'Quelque chose a ricané dans le mur.', 'Les chandelles vacillent… Mauvaise réponse.', 'Le chat noir vous fixe. Il n’est pas impressionné.', 'Une voix chuchote : « Encore… »', 'Un courant d’air glacé vous frôle la nuque.'];
var BRAVOS = ['Le sceau se brise.', 'Un cliquetis dans le mur…', 'La serrure cède.', 'Le manoir frissonne.'];

/* ---------------------------------------------------------------- État */
var S = lire(CLE) || { eq: null, etape: 0, plumes: 3, ind: {} };

/* ---------------------------------------------------------------- Ambiance visuelle */
var evT = null, evMode = null;
function evenements(m) {
  evMode = m; clearTimeout(evT);

}
function planifier() {
  var d = evMode === 'tni' ? 16000 + Math.random() * 22000 : 28000 + Math.random() * 40000;
  evT = setTimeout(function () { try { evenement(); } catch (e) {} planifier(); }, d);
}
function ajouter(el, duree) { document.body.appendChild(el); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, duree); }
function evenement() {
  var t = evMode === 'tni' ? hasard(['chauve', 'yeux', 'eclair', 'chuchot', 'yeux', 'chauve', 'araignee']) : hasard(['yeux', 'araignee', 'yeux', 'chuchot']);
  var el = document.createElement('div');

    el.className = 'yeux'; el.innerHTML = '<i></i><i></i>';

  } else if (t === 'araignee') {

    el.style.left = (72 + Math.random() * 22) + '%';

}

/* ---------------------------------------------------------------- Outils d'écran */
var murT = null;
function murmure(txt) {
  var m = $('#murmure');

  clearTimeout(murT); murT = setTimeout(function () { m.classList.remove('vu'); }, 3200);
}
function voile(html, gestion) {
  var v = document.createElement('div');

  v.onclick = function (e) { var t = cible(e, v); if (t) gestion(action(t), t, v); };
  document.body.appendChild(v);
  return v;
}
function fermer(v) { if (v && v.parentNode) v.parentNode.removeChild(v); }
function rate(el, msg) { SON.fx('rate'); secouer(el); murmure(msg || hasard(MOQUERIES)); }
function titre(et) { return '<h2>' + et.titre + '</h2>' + (et.consigne ? '<p class="consigne">' + et.consigne + '</p>' : ''); }
function mode(m) {
  document.body.className = 'mode-' + m;
  evenements(m);
  SON.ambiance(m === 'equipe' ? 0.7 : (m === 'tni' ? 1.3 : 0));
}

/* ---------------------------------------------------------------- Accueil */

    '<h1 class="lueur">Le manoir<br>de Grisemine</h1><p class="sous">Un jeu d’évasion d’Halloween pour toute la classe</p><div class="choix-eq">';

    h += '<div class="eq-btn" data-a="eq" data-id="' + ORDRE_EQ[i] + '" style="border-color:' + e.couleur + '">' + ico(e.icone) + '<b style="color:' + e.couleur + '">' + e.nom + '</b><small>' + e.piece + '</small></div>';
  }
  h += '</div><div class="liens"><span class="btn btn-sec" data-a="tni">Tableau de la classe (TNI)</span><span class="btn btn-sec" data-a="guide">Guide de l’enseignant</span></div></div></div>';
  app.innerHTML = h;
  app.onclick = function (ev) {
    var t = cible(ev, app), a = action(t);
    if (a === 'eq') {
      var id = t.getAttribute('data-id'), e = EQ[id];

        fermer(v);
        if (a2 === 'oui') { S = { eq: id, etape: 0, plumes: 3, ind: {} }; sauver(); SON.fx('porte'); equipe(); }
      });
    } else if (a === 'tni') tni();
    else if (a === 'guide') guide();

}

/* ---------------------------------------------------------------- Écran d'équipe */
var tapN = 0, tapT = 0;
function enigmes(eq) {
  var r = [], i, ty;
  for (i = 0; i < eq.etapes.length; i++) { ty = eq.etapes[i].type; if (ty !== 'recit' && ty !== 'message' && ty !== 'fin') r.push(i); }
  return r;
}
function entete(eq) {
  var en = enigmes(eq), p = '', i;
  for (i = 0; i < en.length; i++) p += ico('chandelle', en[i] < S.etape ? 'on' : '');
  return '<div id="entete"><div class="blason" data-a="blason" style="border-color:' + eq.couleur + '">' + ico(eq.icone) + '</div>' +
    '<div class="ent-titre"><b style="color:' + eq.couleur + '">' + eq.piece + '</b><small>Équipe des ' + eq.nom + '</small></div>' +
    '<div class="progres">' + p + '</div>' +
    '<div class="btn-mini" data-a="indice">' + ico('plume') + '× ' + S.plumes + '</div>' +
    '<div class="btn-mini" data-a="son">' + (SON.actif() ? 'Son' : 'Muet') + '</div></div>';
}
function equipe() {
  var eq = EQ[S.eq];
  if (!eq) { accueil(); return; }
  if (S.etape >= eq.etapes.length) S.etape = eq.etapes.length - 1;
  if (document.body.className !== 'mode-equipe') mode('equipe');
  var et = eq.etapes[S.etape];
  app.innerHTML = entete(eq) + '<div class="defile" id="defile"><div class="page" id="zone"></div></div>';
  app.onclick = function (ev) {
    var t = cible(ev, $('#entete')), a = action(t);
    if (a === 'blason') blason();
    else if (a === 'indice') indice();
    else if (a === 'son') { SON.basculer(); t.innerHTML = SON.actif() ? 'Son' : 'Muet'; }
  };
  RENDU[et.type](et, $('#zone'), eq);
}
function avancer() { S.etape++; sauver(); SON.fx('porte'); equipe(); }
function reussir(msg) {
  SON.fx('bon');
  voile('<div class="titre-voile">' + hasard(BRAVOS) + '</div><p>' + (msg || '') + '</p><span class="btn" data-a="suite">Continuer</span>', function (a, t, v) {
    if (a === 'suite') { fermer(v); avancer(); }
  });
}
function indice() {
  var eq = EQ[S.eq], et = eq.etapes[S.etape], k = S.ind[S.etape] || 0;
  if (!et.indices) { murmure('Pas de plume nécessaire ici : avancez !'); return; }
  function montrer(n) {
    var h = '<div class="titre-voile">Indices</div>', i;
    for (i = 0; i < n; i++) h += '<div class="indice">' + et.indices[i] + '</div>';
    if (n < et.indices.length) h += '<p style="font-size:16px;opacity:.7">Il reste ' + (et.indices.length - n) + ' indice(s) pour cette énigme.</p>';
    h += '<span class="btn" data-a="ok">Fermer</span>';
    voile(h, function (a, t, v) { if (a === 'ok') fermer(v); });
  }
  if (k >= et.indices.length) { montrer(k); return; }
  if (S.plumes <= 0) {
    if (k > 0) montrer(k); else murmure('Plus de plumes de corbeau… Demandez à votre enseignant(e).');
    return;
  }
  voile(ico('plume', 'msg-ico') + '<div class="titre-voile">Brûler une plume ?</div><p>Chaque plume de corbeau révèle un indice. Il vous en reste <b>' + S.plumes + '</b> pour tout le jeu.</p>' +
    '<span class="btn" data-a="oui">Brûler une plume</span>' + (k > 0 ? '<span class="btn btn-sec" data-a="revoir">Revoir mes indices</span>' : '') + '<span class="btn btn-sec" data-a="non">Non</span>', function (a, t, v) {
    fermer(v);
    if (a === 'oui') { S.plumes--; S.ind[S.etape] = k + 1; sauver(); SON.fx('chuchote'); equipe(); montrer(k + 1); }
    else if (a === 'revoir') montrer(k);
  });
}
function blason() {
  var n = Date.now();
  if (n - tapT > 1500) tapN = 0;
  tapT = n; tapN++;
  if (tapN < 5) return;
  tapN = 0;
  var c = window.prompt('Code de l’enseignant');
  if (c !== CODE_PROF) return;
  voile('<div class="titre-voile">Menu de l’enseignant</div><p>Étape ' + (S.etape + 1) + ' sur ' + EQ[S.eq].etapes.length + ' — ' + S.plumes + ' plume(s)</p>' +
    '<span class="btn" data-a="passer">Passer cette étape</span><span class="btn" data-a="reculer">Reculer d’une étape</span><br>' +
    '<span class="btn" data-a="plumes">Redonner 3 plumes</span><span class="btn" data-a="changer">Changer d’équipe</span><br>' +
    '<span class="btn btn-sec" data-a="zero">Recommencer cette équipe</span><span class="btn btn-sec" data-a="non">Fermer</span>', function (a, t, v) {
    fermer(v);
    if (a === 'passer' && S.etape < EQ[S.eq].etapes.length - 1) { S.etape++; sauver(); equipe(); }
    else if (a === 'reculer' && S.etape > 0) { S.etape--; sauver(); equipe(); }
    else if (a === 'plumes') { S.plumes += 3; sauver(); equipe(); }
    else if (a === 'changer') { S = { eq: null, etape: 0, plumes: 3, ind: {} }; sauver(); accueil(); }
    else if (a === 'zero') { S = { eq: S.eq, etape: 0, plumes: 3, ind: {} }; sauver(); equipe(); }
  });
}

/* Cadenas à chiffres, partagé par les équipes et le Tableau */
function cadenas(el, code, ok, label) {
  var n = code.length, saisie = '', bloque = false, h, i;
  var touches = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Effacer', '0', ''];
  h = '<div class="cad">' + ico('cadenas', 'cad-ico') + '<div class="cad-t">' + (label || 'Cadenas') + '</div><div class="cases">';
  for (i = 0; i < n; i++) h += '<span class="case"></span>';
  h += '</div><div class="pave">';
  for (i = 0; i < touches.length; i++) h += '<button type="button" data-k="' + touches[i] + '" class="' + (touches[i].length > 1 ? 'petit' : (touches[i] ? '' : 'vide')) + '">' + touches[i] + '</button>';
  h += '</div></div>';
  el.innerHTML = h;
  var cases = el.querySelectorAll('.case'), boite = el.querySelector('.cases');
  function maj() { for (var j = 0; j < n; j++) cases[j].innerHTML = saisie.charAt(j); }
  el.onclick = function (e) {
    var t = e.target;
    while (t && t !== el && t.tagName !== 'BUTTON') t = t.parentNode;
    if (!t || t === el || bloque) return;
    var k = t.getAttribute('data-k');
    if (!k) return;
    if (k === 'Effacer') saisie = saisie.slice(0, -1);
    else if (saisie.length < n) { saisie += k; SON.fx('tap'); }
    maj();
    if (saisie.length === n) {
      bloque = true;
      if (saisie === code) { boite.classList.add('ouvert'); SON.fx('clic'); setTimeout(ok, 700); }
      else setTimeout(function () { rate(boite, 'Le cadenas ne bouge pas. ' + hasard(MOQUERIES)); saisie = ''; maj(); bloque = false; }, 350);
    }
  };
}

/* ---------------------------------------------------------------- Types d'énigmes */

  },

      else rate(t, op.non);

/* ---------------------------------------------------------------- Le Tableau (TNI) */
var T = lire(CLE_TNI) || { fin: null, reste: null, duree: 45, libres: {} };
function sauverT() { ecrire(CLE_TNI, T); }
var tick = null, alerte = false, dernierCoeur = 0;
var INTRO = [
  'Il y a des maisons devant lesquelles on presse le pas. Celle du bout de la rue des Ormes en fait partie.',
  'Hier soir, une odeur de caramel chaud s’en échappait. Une odeur si bonne… que vous l’avez suivie.',
  'La porte s’est ouverte toute seule. Puis elle s’est refermée derrière vous, dans un long grincement.',
  'Sur la table, un mot griffonné : « Partie faire une dernière course. Ne touchez à rien. Je reviens très vite. — Grisemine »',
  'Le manoir a quatre pièces. Chaque équipe en fouillera une. Mais les portes sont scellées, et chaque sceau ne se brise qu’avec un mot connu… d’une AUTRE équipe.',
  'Personne ne sortira seul. Trouvez les quatre ingrédients du contre-sort, réunissez-vous autour du Grand Chaudron et prononcez la formule. Ensemble. Avant son retour.'
];
function coinProf() { return '<span class="coin-prof" data-a="maison">Accueil</span>'; }
function tni() {
  clearInterval(tick);
  mode('tni');
  if (T.fin || T.reste !== null) tniVeille(); else tniIntro();
}
function tniIntro() {
  var p = 0;
  function rendu() {
    var h = coinProf() + '<div class="defile"><div class="tni-intro"><h1 class="lueur">Le manoir de Grisemine</h1>', i;
    for (i = 0; i <= p; i++) h += '<p class="' + (i === p ? 'apparait' : '') + '">' + INTRO[i] + '</p>';
    if (p < INTRO.length - 1) h += '<span class="btn" data-a="suite">Suite…</span>';
    else h += '<div class="duree">Durée : <span class="btn btn-sec" data-a="moins">−5</span><b>' + T.duree + ' min</b><span class="btn btn-sec" data-a="plus">+5</span></div><span class="btn" data-a="go">Verrouiller les portes</span>';
    app.innerHTML = h + '</div></div>';
  }
  rendu();
  app.onclick = function (e) {
    var a = action(cible(e, app));
    if (a === 'suite') { p++; SON.fx('chuchote'); rendu(); }
    else if (a === 'moins' && T.duree > 10) { T.duree -= 5; rendu(); }
    else if (a === 'plus') { T.duree += 5; rendu(); }
    else if (a === 'go') { T.fin = Date.now() + T.duree * 60000; T.reste = null; T.libres = {}; alerte = false; sauverT(); SON.fx('porte'); SON.fx('gong'); tniVeille(); }
    else if (a === 'maison') { clearInterval(tick); accueil(); }
  };
}
function resteMs() { return T.fin ? T.fin - Date.now() : (T.reste || 0); }
function tniVeille() {
  var h = coinProf() + '<div class="tni tni-veille"><div class="tni-scene"><div class="scene">' + sceneSVG() + '</div></div><div class="tni-cote">' +
    '<div class="chrono-l">Retour de Grisemine dans</div><div class="chrono" id="chrono">--:--</div>' +
    '<div class="bougie-tni"><div class="corps" id="corps"><div class="flamme"></div></div></div>' +
    '<div class="chrono-l">Ingrédients trouvés</div><div class="blasons-tni">', i, e;
  for (i = 0; i < ORDRE_EQ.length; i++) { e = EQ[ORDRE_EQ[i]]; h += '<span data-a="libre" data-id="' + ORDRE_EQ[i] + '" class="' + (T.libres[ORDRE_EQ[i]] ? 'libre' : '') + '" style="border-color:' + e.couleur + ';color:' + e.couleur + '">' + ico(e.icone) + '</span>'; }
  h += '</div><div class="tni-btns"><span class="btn btn-sec" data-a="pause">' + (T.fin ? 'Pause' : 'Reprendre') + '</span><span class="btn btn-sec" data-a="plus5">+5 min</span><br><span class="btn" data-a="chaudron">Le Grand Chaudron</span><br><span class="btn btn-sec" data-a="raz" style="font-size:1.1vw">Recommencer le jeu</span></div></div></div>';
  app.innerHTML = h;
  app.onclick = function (ev) {
    var t = cible(ev, app), a = action(t);
    if (a === 'libre') { var id = t.getAttribute('data-id'); T.libres[id] = !T.libres[id]; t.className = T.libres[id] ? 'libre' : ''; if (T.libres[id]) SON.fx('bon'); sauverT(); }
    else if (a === 'pause') {
      if (T.fin) { T.reste = T.fin - Date.now(); T.fin = null; t.innerHTML = 'Reprendre'; }
      else { T.fin = Date.now() + (T.reste || 0); T.reste = null; t.innerHTML = 'Pause'; }
      sauverT(); maj();
    }
    else if (a === 'plus5') { if (T.fin) T.fin += 300000; else T.reste = (T.reste || 0) + 300000; alerte = false; sauverT(); maj(); }
    else if (a === 'chaudron') { clearInterval(tick); document.body.classList.remove('urgence'); tniChaudron(); }
    else if (a === 'raz') { if (window.confirm('Effacer le chrono et recommencer le jeu au Tableau ?')) { T = { fin: null, reste: null, duree: T.duree, libres: {} }; sauverT(); document.body.classList.remove('urgence'); tni(); } }
    else if (a === 'maison') { clearInterval(tick); accueil(); }
  };
  function maj() {
    var r = Math.max(0, resteMs()), s = Math.ceil(r / 1000), mm = Math.floor(s / 60), ss = s % 60;
    var c = $('#chrono'); if (!c) return;
    c.innerHTML = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
    $('#corps').style.height = Math.max(4, Math.min(100, r / (T.duree * 60000) * 100)) + '%';
    if (r <= 300000) document.body.classList.add('urgence'); else document.body.classList.remove('urgence');
    if (T.fin && r <= 120000 && r > 0 && Date.now() - dernierCoeur > 1300) { dernierCoeur = Date.now(); SON.fx('coeur'); }
    if (T.fin && r <= 0 && !alerte) {
      alerte = true; SON.fx('porte');
      voile(ico('chat', 'msg-ico') + '<div class="titre-voile">Des pas dans l’allée…</div><p>Une clé tourne dans la serrure. Grisemine est sur le seuil !<br>…Mais elle fouille son sac. Elle a oublié quelque chose.</p>' +
        '<span class="btn" data-a="plus5">Elle repart chercher son chapeau (+5 min)</span><span class="btn btn-sec" data-a="chaudron">Le Grand Chaudron</span>', function (a2, t2, v) {
        fermer(v);
        if (a2 === 'plus5') { T.fin = Date.now() + 300000; alerte = false; sauverT(); maj(); }
        else if (a2 === 'chaudron') { clearInterval(tick); document.body.classList.remove('urgence'); tniChaudron(); }
      });
    }
  }
  maj();
  clearInterval(tick); tick = setInterval(maj, 500);
}
var RECETTE = [
  { id: 'chauve', nom: 'Aile de chauve-souris', ico: 'chauve', vers: 'Par l’aile noire et la lune pâle,' },
  { id: 'araignee', nom: 'Fil d’araignée', ico: 'araignee', vers: 'par le fil qui tisse la toile,' },
  { id: 'hibou', nom: 'Plume de hibou', ico: 'plume', vers: 'par la plume qui veille la nuit,' },
  { id: 'citrouille', nom: 'Graine de citrouille', ico: 'cit-lanterne', vers: 'que la porte s’ouvre… avant minuit !' }
];
function tniChaudron() {
  var k = 0, boutons = melange(RECETTE), bloque = false;
  function rendu() {
    var h = coinProf() + '<div class="tni chaudron-ecran"><div class="ch-gauche"><h2 class="lueur">Le Grand Chaudron</h2>' +
      '<p>Versez les quatre ingrédients dans le bon ordre :</p>' +
      '<p>D’abord, ce qui dort la tête en bas.</p><p>Puis, ce qui tisse sans aiguille.</p><p>Ensuite, ce qui voit dans le noir et tourne la tête presque jusque dans son dos.</p><p>Enfin, ce qui sourit avec une flamme dans la tête.</p></div>' +
      '<div class="ch-centre">' + ico('chaudron', 'gros-chaudron') + '<div class="fentes" id="fentes">', i;
    for (i = 0; i < RECETTE.length; i++) h += '<span>' + (i < k ? ico(RECETTE[i].ico) : '') + '</span>';
    h += '</div><div class="ingredients-tni">';
    for (i = 0; i < boutons.length; i++) {
      var deja = false;
      for (var j = 0; j < k; j++) if (RECETTE[j].id === boutons[i].id) deja = true;
      h += '<span data-a="ingr" data-id="' + boutons[i].id + '" style="' + (deja ? 'visibility:hidden' : '') + '">' + ico(boutons[i].ico) + boutons[i].nom + '</span>';
    }
    app.innerHTML = h + '</div></div></div>';
  }
  rendu();
  app.onclick = function (e) {
    var t = cible(e, app), a = action(t);
    if (a === 'maison') { accueil(); return; }
    if (a !== 'ingr' || bloque) return;
    if (t.getAttribute('data-id') === RECETTE[k].id) {
      k++; SON.fx('bulle'); rendu();
      if (k === RECETTE.length) { bloque = true; setTimeout(function () { SON.fx('gong'); tniCouvercle(); }, 900); }
    } else {
      bloque = true; rate(t, 'Le chaudron recrache tout dans un gros « BLOURP ».');
      setTimeout(function () { k = 0; bloque = false; rendu(); }, 900);
    }
  };
}
function tniCouvercle() {
  app.innerHTML = coinProf() + '<div class="tni chaudron-ecran"><div class="ch-gauche"><h2 class="lueur">Le couvercle est scellé</h2>' +
    '<p>Le chaudron bouillonne, mais son couvercle refuse de s’ouvrir.</p><p>Chaque équipe a reçu un chiffre. Placez-les dans l’ordre de la recette : aile, fil, plume, graine.</p></div>' +
    '<div class="ch-centre" id="cad-tni"></div></div>';
  app.onclick = function (e) { if (action(cible(e, app)) === 'maison') accueil(); };
  cadenas($('#cad-tni'), '3110', function () {
    SON.fx('bon');
    voile('<div class="titre-voile">31 / 10</div><p style="font-size:2.4vw">La nuit d’Halloween. La nuit de Grisemine.<br>Le couvercle se soulève… Il ne reste plus qu’à prononcer la formule.</p><span class="btn" data-a="ok">La formule</span>', function (a, t, v) {
      if (a === 'ok') { fermer(v); tniFormule(); }
    });
  }, 'Couvercle du chaudron');
}
function tniFormule() {
  var n = 0;
  function rendu() {
    var h = coinProf() + '<div class="defile"><div class="formule"><h2 class="lueur">La formule du contre-sort</h2>', i;
    for (i = 0; i < n; i++) h += '<div class="ligne apparait">' + ico(RECETTE[i].ico) + RECETTE[i].vers + '</div>';
    if (n < RECETTE.length) h += '<p class="tous" style="font-size:2vw">' + (n === 0 ? 'Chaque équipe lit sa ligne à voix haute, dans l’ordre de la recette.' : '') + '</p><span class="btn" data-a="suite">' + (n === 0 ? 'Première ligne' : 'Ligne suivante') + '</span>';
    else h += '<div class="tous apparait">Maintenant… TOUS ENSEMBLE, à voix haute !</div><span class="btn" data-a="fini">La formule est prononcée</span>';
    app.innerHTML = h + '</div></div>';
  }
  rendu();
  app.onclick = function (e) {
    var a = action(cible(e, app));
    if (a === 'suite') { n++; SON.fx('tinte'); rendu(); }
    else if (a === 'fini') tniFinale();
    else if (a === 'maison') accueil();
  };
}
function tniFinale() {
  evenements('fin');
  SON.ambiance(0); SON.fx('gong'); SON.fx('porte');
  var ec = $('#eclair'); ec.classList.remove('flash'); void ec.offsetWidth; ec.classList.add('flash');
  var lignes = ['Le chaudron se tait.', 'Quelque part, une porte grince…', '<span class="gros">Vous êtes libres.</span>', 'Grisemine rentre de ses courses et trouve son manoir vide. Elle hurle… puis elle éclate de rire.', '<span class="petit">« Bien joué, mes petits. À l’an prochain… »</span>'];
  var h = coinProf() + '<div class="finale">', i;
  for (i = 0; i < lignes.length; i++) h += '<p id="fl' + i + '"' + (i === 4 ? ' class="petit"' : '') + '>' + lignes[i] + '</p>';
  app.innerHTML = h + '</div>';
  app.onclick = function (e) { if (action(cible(e, app)) === 'maison') accueil(); };
  for (i = 0; i < 14; i++) (function (j) {
    var b = document.createElement('div');
    b.className = 'bat-f'; b.innerHTML = ico('chauve');
    document.body.appendChild(b);
    setTimeout(function () {
      var ang = j / 14 * Math.PI * 2, d = 600 + Math.random() * 500;
      b.style.transform = 'translate3d(' + Math.round(Math.cos(ang) * d) + 'px,' + Math.round(Math.sin(ang) * d) + 'px,0) scale(' + (0.6 + Math.random()) + ')';
      b.style.opacity = '0';
    }, 60 + j * 40);
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 4000);
  })(i);
  for (i = 0; i < lignes.length; i++) (function (j) {
    setTimeout(function () { var p = $('#fl' + j); if (p) p.classList.add('vu'); if (j === 2) SON.fx('bon'); if (j === 4) SON.fx('chuchote'); }, 1200 + j * 2600);
  })(i);
  setTimeout(function () {
    var y = document.createElement('div'); y.className = 'yeux'; y.innerHTML = '<i></i><i></i>';
    y.style.left = '88%'; y.style.top = '82%'; ajouter(y, 4400);
  }, 15000);
}

/* ---------------------------------------------------------------- Guide de l'enseignant */
function guide() {
  mode('guide');
  app.innerHTML = '<div class="guide"><div class="page">' +
    '<p class="no-print"><span class="btn" data-a="maison" style="background:#4a1d5e">← Accueil</span> <span class="btn" data-a="imprimer" style="background:#4a1d5e">Imprimer</span></p>' +
    '<h1>Le manoir de Grisemine — guide de l’enseignant</h1>' +
    '<p>Jeu d’évasion collectif pour une classe de 6<sup>e</sup> année, en 4 équipes de 4. Durée : 45 à 60 minutes. Notions : décomposition de nombres, constructions du groupe du nom, accords dans le GN, inférences.</p>' +
    '<h2>Matériel</h2><ul><li>4 iPad (un par équipe) ouverts sur cette page.</li><li>Le tableau (TNI) ouvert sur cette même page, bouton « Tableau de la classe ». Le son du TNI fait beaucoup pour l’ambiance : montez le volume.</li><li>Rien à imprimer. Lumières tamisées, idéalement.</li></ul>' +
    '<h2>Mise en place (5 minutes)</h2><ol><li>Sur chaque iPad : ouvrir la page, toucher l’équipe. La tablette reste liée à cette équipe (même si on recharge la page).</li><li>Au TNI : « Tableau de la classe », lire la mise en situation à voix haute (bouton « Suite »), choisir la durée, puis « Verrouiller les portes ».</li><li>Pendant le jeu, quand une équipe trouve son ingrédient, touchez son blason au TNI : il s’allume.</li></ol>' +
    '<h2>Ce qui rend la quête collective</h2><ul><li><b>Les messages des esprits.</b> Après sa première énigme, chaque équipe reçoit un mot de passe… destiné à une AUTRE équipe. Un messager va le chuchoter.</li><li><b>Les sceaux.</b> Avant sa dernière énigme, chaque équipe doit entrer le mot reçu d’une autre équipe. Personne ne finit seul : Chauves-souris → Araignées → Citrouilles → Hiboux → Chauves-souris.</li><li><b>Le Grand Chaudron.</b> La fin se joue au TNI, toute la classe ensemble : chaque équipe apporte un ingrédient, un chiffre et une ligne de la formule.</li><li>L’écran de fin invite les équipes qui ont terminé à aller aider les autres (avec des indices, pas des réponses).</li></ul>' +
    '<h2>Indices et code de l’enseignant</h2><p>Chaque équipe a <b>3 plumes de corbeau</b> pour tout le jeu (bouton en haut à droite) ; une plume = un indice. Pour débloquer une équipe : touchez <b>5 fois rapidement</b> le blason rond en haut à gauche de l’iPad, puis entrez le code <span class="code">1031</span>. Vous pourrez passer une étape, reculer, redonner des plumes ou changer d’équipe.</p>' +
    '<h2>Solutionnaire</h2>' +
    '<table><tr><th>Équipe</th><th>Énigme 1</th><th>Mot à livrer</th><th>Énigme 2</th><th>Sceau (mot reçu)</th><th>Énigme 3</th><th>Chiffre</th></tr>' +
    '<tr><td><b>Chauves-souris</b><br>Grenier</td><td>Philtre du Chat-Fantôme (inférence)</td><td class="code">CHANDELLE<br>→ Araignées</td><td>60 000 + 4 000 + 300 + 50 + 7 = <span class="code">64357</span></td><td class="code">LANTERNE</td><td>amère · baveux · vieilles · noires · bel</td><td class="code">3</td></tr>' +
    '<tr><td><b>Araignées</b><br>Remise</td><td>Tri des 8 GN par construction</td><td class="code">BROUILLARD<br>→ Citrouilles</td><td>rouge · violet · bleu · vert · rouge · bleu</td><td class="code">CHANDELLE</td><td>ces griffes crochues · un chapeau à pointe · la toile de l’araignée</td><td class="code">1</td></tr>' +
    '<tr><td><b>Citrouilles</b><br>Jardin</td><td>1 momie (7), 2 effrayée (2), 3 sorcière (1), 4 Frankenstein (5), 5 clown (8) = <span class="code">72158</span></td><td class="code">SORTILÈGE<br>→ Hiboux</td><td>4 020 · 4 030 · 4 300 · 4 305 · 40 003 = OMBRE</td><td class="code">BROUILLARD</td><td>crapauds · poilue · noires · grises · ongles</td><td class="code">0</td></tr>' +
    '<tr><td><b>Hiboux</b><br>Bibliothèque</td><td>Le corbeau (inférence)</td><td class="code">LANTERNE<br>→ Chauves-souris</td><td>sombres · vieille · poussiéreux · belle · jaunies · nouvel = MINUIT</td><td class="code">SORTILÈGE</td><td>La cuisine de la sorcière · Le chat vampire · Une soupe de citrouille · Les nuits glaciales</td><td class="code">1</td></tr></table>' +
    '<h2>Le Grand Chaudron (au TNI)</h2><ol><li>Ordre des ingrédients : aile de chauve-souris, fil d’araignée, plume de hibou, graine de citrouille.</li><li>Couvercle : les chiffres dans cet ordre donnent <span class="code">3110</span> (le 31 octobre).</li><li>La formule, une ligne par équipe, puis tous ensemble :<br><i>Par l’aile noire et la lune pâle, / par le fil qui tisse la toile, / par la plume qui veille la nuit, / que la porte s’ouvre… avant minuit !</i></li></ol>' +
    '<h2>Quand le temps est écoulé</h2><p>Grisemine arrive sur le seuil… et repart chercher son chapeau : le TNI propose d’ajouter 5 minutes. Personne ne perd, le jeu va jusqu’au bout.</p>' +
    '<h2>Pour rejouer avec un autre groupe</h2><p>Sur chaque iPad : code enseignant → « Changer d’équipe ». Au TNI : « Recommencer le jeu ».</p>' +
    '</div></div>';
  app.onclick = function (e) {
    var a = action(cible(e, app));
    if (a === 'maison') accueil();
    else if (a === 'imprimer') window.print();
  };
}

/* ---------------------------------------------------------------- Démarrage */
var q = window.location.search || '';
if (q.indexOf('tni') >= 0) tni();
else if (q.indexOf('guide') >= 0) guide();
else if (S.eq && EQ[S.eq]) equipe();
else accueil();

})();
